{{ range $jdkType, $jdkRelease := dict "BUILD_JDK_MAJOR" 21 "JENKINS_AGENT_JDK_MAJOR" 25 }}
---
name: Bump {{ $jdkType }} (JDK{{ $jdkRelease }})

scms:
  default:
    kind: github
    spec:
      user: "{{ $.github.user }}"
      email: "{{ $.github.email }}"
      owner: "{{ $.github.owner }}"
      repository: "{{ $.github.repository }}"
      token: "{{ requiredEnv $.github.token }}"
      username: "{{ $.github.username }}"
      branch: "{{ $.github.branch }}"

sources:
  # This source is only required for the Dockerfile targets as updatecli does not support input values for
  # the kind 'dockerfile' other than a source
  get_JDK_release:
    kind: shell
    name: Print the JDK release (e.g. major version)
    spec:
      command: echo "{{ $jdkRelease }}"
  get_latest_JDK_version:
    kind: temurin
    name: Get the latest Adoptium JDK{{ $jdkRelease }} version via the API
    spec:
      featureversion: {{ $jdkRelease }}
    transformers:
      - trimprefix: "jdk-"
  get_linux_x64_installer_url:
    name: Retrieve the latest JDK {{ $jdkRelease }} Installer URL for Linux (x64)
    kind: temurin
    dependson:
      - get_latest_JDK_version
    spec:
      architecture: x64
      operatingsystem: linux
      specificversion: '{{ source "get_latest_JDK_version" }}'
      releasetype: ga
      result: installer_url

targets:
  {{- $prefix := printf "jdk%d/linux/amd64/glibc" $jdkRelease }}
  set_linux_x64:
    name: Bump JDK{{ $jdkRelease }} Installer URL for Linux (x64)
    kind: file
    sourceid: get_linux_x64_installer_url
    transformers:
      - addprefix: '{{ $prefix }} ' # Trailing space is important! It's the separator
    spec:
      file: adoptium/jdk_installers.txt
      matchpattern: '{{ $prefix }} (.*)'
    scmid: default
  updateDockerfileMajorVersion:
    name: Update the value of ARG {{ $jdkType }} in the Dockerfile
    sourceid: get_JDK_release
    kind: dockerfile
    spec:
      file: ./Dockerfile
      instruction:
        keyword: ARG
        matcher: {{ $jdkType }}
    scmid: default
actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: Bump {{ $jdkType }} (JDK{{ $jdkRelease }}) to {{ source "get_latest_JDK_version" }}
    spec:
      labels:
        - dependencies
        - "jdk{{ $jdkRelease }}"
...
{{- end }}
