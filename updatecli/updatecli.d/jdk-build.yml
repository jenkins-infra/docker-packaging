---
name: Bump JDK version

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  majorJdkVersion:
    kind: shell
    name: Get the major JDK version
    spec:
      command: echo "{{ .jdk.majorVersion }}"
  lastVersion:
    kind: temurin
    name: Get the latest Adoptium JDK{{ .jdk.majorVersion }} version
    spec:
      featureversion: {{ .jdk.majorVersion }}
    transformers:
      - trimprefix: "jdk-"
  buildJdkInstallerUrl:
    kind: temurin
    name: Get the JDK{{ .jdk.majorVersion }} installer URL
    dependson:
      - lastVersion
    spec:
      specificversion: 'jdk-{{ source "lastVersion" }}'
      architecture: x64
      operatingsystem: linux
      releasetype: ga
      result: installer_url
  agentLastVersion:
    kind: temurin
    name: Get the latest Adoptium JDK{{ .jdk.agentMajorVersion }} version
    spec:
      featureversion: {{ .jdk.agentMajorVersion }}
    transformers:
      - trimprefix: "jdk-"
  agentJdkInstallerUrl:
    kind: temurin
    name: Get the JDK{{ .jdk.agentMajorVersion }} installer URL
    dependson:
      - agentLastVersion
    spec:
      specificversion: 'jdk-{{ source "agentLastVersion" }}'
      architecture: x64
      operatingsystem: linux
      releasetype: ga
      result: installer_url
  mavenCurrentCstVersion:
    kind: yaml
    name: Get the current maven version for cst update
    spec:
      file: ./cst.yml
      key: $.commandTests[1].expectedOutput[1]

targets:
  updateBuildJdkInstallerUrl:
    name: Update the JDK{{ .jdk.majorVersion }} installer URL
    sourceid: buildJdkInstallerUrl
    kind: file
    transformers:
      - addprefix: 'jdk{{ .jdk.majorVersion }}/linux/amd64/glibc '
    spec:
      file: ./adoptium/jdk_installers.txt
      matchpattern: 'jdk{{ .jdk.majorVersion }}/linux/amd64/glibc (.*)'
    scmid: default
  updateAgentJdkInstallerUrl:
    name: Update the JDK{{ .jdk.agentMajorVersion }} installer URL
    sourceid: agentJdkInstallerUrl
    kind: file
    transformers:
      - addprefix: 'jdk{{ .jdk.agentMajorVersion }}/linux/amd64/glibc '
    spec:
      file: ./adoptium/jdk_installers.txt
      matchpattern: 'jdk{{ .jdk.agentMajorVersion }}/linux/amd64/glibc (.*)'
    scmid: default
  updateDockerfileMajorVersion:
    name: Update the value of ARG BUILD_JDK_MAJOR in the Dockerfile
    sourceid: majorJdkVersion
    kind: dockerfile
    spec:
      file: ./Dockerfile
      instruction:
        keyword: ARG
        matcher: BUILD_JDK_MAJOR
    scmid: default
  updateTestHarnessCommandTests0-name:
    name: Update Test Harnes file CommandTest 0 Name
    sourceid: majorJdkVersion
    kind: yaml
    spec:
      file: ./cst.yml
      key: $.commandTests[0].name
      value: "Check that `java` {{ .jdk.majorVersion }} binary for agent processes is present"
    scmid: default
  updateTestHarnessCommandTests0-command:
    name: Update Test Harnes file CommandTest 0 Command
    sourceid: majorJdkVersion
    kind: yaml
    spec:
      file: ./cst.yml
      key: $.commandTests[0].command
      value: "/opt/jdk-{{ .jdk.majorVersion }}/bin/java"
    scmid: default
  updateTestHarnessCommandTests0-expectedOutput:
    name: Update Test Harnes file CommandTest 0 expectedOutput
    sourceid: majorJdkVersion
    kind: yaml
    spec:
      file: ./cst.yml
      key: $.commandTests[0].expectedOutput[0]
      value: "Temurin-{{ .jdk.majorVersion }}"
    scmid: default
  updateTestHarnessCommandTests1-expectedOutput:
    name: Update Test Harnes file CommandTest 1 expectedOutput
    sourceid: majorJdkVersion
    kind: yaml
    spec:
      file: ./cst.yml
      key: $.commandTests[1].expectedOutput[0]
      value: "Java version: {{ .jdk.majorVersion }}."
    scmid: default
actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: Bump JDK{{ .jdk.majorVersion }} version to {{ source "lastVersion" }}
    spec:
      labels:
        - dependencies
        - "jdk{{ .jdk.majorVersion }}"
